version: '3.8'

services:
  app:
    build: .
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - APP_URL=http://localhost:5000
      - MONGODB_URI=mongodb://mongo:27017/ai-creatorhub
      - DATABASE_URL=postgresql://creator:creator123@postgres:5432/aicreatorhub_db
      - JWT_SECRET=${JWT_SECRET:-dev_fallback_secret}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: creator
      POSTGRES_PASSWORD: creator123
      POSTGRES_DB: aicreatorhub_db
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U creator -d aicreatorhub_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

  mongo:
    image: mongo:6-jammy
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - mongo_data:/data/db

volumes:
  postgres_data:
  mongo_data:
